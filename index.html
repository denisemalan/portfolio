<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denise Malan | Technical Writer & Editor</title>
<meta name="description" content="Portfolio of Denise Malan: technical writer, editor, and trainer in AI, data, and journalism.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f9;--surface:#fff;--ink:#16233b;--muted:#55627a;--line:#d9e0e8;--accent:#17696a;--accent-ink:#fff;--tint:#e1eeee;
--serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f1724;--surface:#172134;--ink:#e8edf5;--muted:#9aa8bf;--line:#2a374e;--accent:#5cc2c0;--accent-ink:#0f1724;--tint:#1b3238}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
a{color:var(--accent)}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:16px 0}
nav .name{font:700 1.15rem var(--serif);margin-right:auto;color:var(--ink);text-decoration:none}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}nav a:hover{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
.hero{padding:72px 0 40px}
h1{font-size:clamp(2.1rem,5.5vw,3.4rem);max-width:17em;letter-spacing:-.01em}
.hero p{max-width:36em;color:var(--muted);font-size:1.1rem;margin:20px 0 0}
.stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:36px}
.stats b{display:block;font:700 1.9rem var(--serif)}.stats span{color:var(--muted);font-size:.9rem;display:block;max-width:14em}
.lens{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.lens .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lens small{color:var(--muted);margin-right:6px}
.chip{font:500 .9rem var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
section{padding:56px 0 8px}
h2{font-size:1.7rem;margin-bottom:24px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-bottom:16px}
.item.hide{display:none}
.item h3{font-size:1.2rem}.meta{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.item ul{margin:10px 0 0;padding-left:20px}.item p{margin:0}
.badge{display:inline-block;background:var(--tint);color:var(--accent);font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid .item{margin:0}
.skills h3{font-size:1rem;margin-bottom:8px}.skills ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skills li{background:var(--tint);padding:2px 10px;border-radius:4px;font-size:.9rem}
.edu li{margin-bottom:6px}
footer{padding:56px 0 64px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap"><nav aria-label="Main">
<a class="name" href="#top" id="nav-name"></a>
<a href="#experience">Experience</a><a href="#writing">Writing</a><a href="#skills">Skills</a><a href="#about">About</a><a href="#contact">Contact</a>
</nav></div></header>
<main id="top">
<div class="wrap hero"><h1 id="headline"></h1><p id="intro"></p><div class="stats" id="stats"></div></div>
<div class="lens"><div class="wrap" id="lens" role="group" aria-label="Filter by role"><small>View this portfolio as a</small></div></div>
<div class="wrap">
<section id="experience"><h2>Experience</h2><div id="exp"></div></section>
<section id="writing"><h2>Writing samples</h2><div class="grid" id="wr"></div></section>
<section id="skills" class="skills"><h2>Skills</h2><div class="grid" id="sk"></div></section>
<section id="about"><h2>About</h2><div id="ab"></div><h3 style="margin:28px 0 12px">Education & certifications</h3><ul class="edu" id="ed"></ul></section>
</div></main>
<footer id="contact"><div class="wrap"><h2>Contact</h2><p id="ct"></p></div></footer>
<script>
const $=id=>document.getElementById(id);
function el(tag,props={},kids=[]){const e=document.createElement(tag);for(const k in props){k==='text'?e.textContent=props[k]:e.setAttribute(k,props[k])}[].concat(kids).forEach(c=>e.append(c));return e}
let current='all';
function applyLens(){document.querySelectorAll('[data-tags]').forEach(n=>{n.classList.toggle('hide',current!=='all'&&!n.dataset.tags.split(' ').includes(current))});
document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===current))}
fetch('content.json').then(r=>r.json()).then(d=>{
 document.title=d.site.title;$('nav-name').textContent=d.site.name;
 $('headline').textContent=d.hero.headline;$('intro').textContent=d.hero.intro;
 d.stats.forEach(s=>$('stats').append(el('div',{},[el('b',{text:s.value}),el('span',{text:s.label})])));
 d.lenses.forEach(l=>{const b=el('button',{class:'chip','data-id':l.id,type:'button',text:l.label});b.onclick=()=>{current=l.id;applyLens()};$('lens').append(b)});
 d.experience.forEach(x=>{const it=el('article',{class:'item','data-tags':x.tags.join(' ')},[el('h3',{text:x.org}),el('div',{class:'meta',text:x.title+' · '+x.dates})]);
  if(x.summary)it.append(el('p',{text:x.summary}));
  if(x.bullets.length)it.append(el('ul',{},x.bullets.map(b=>el('li',{text:b}))));$('exp').append(it)});
 d.writing.forEach(w=>$('wr').append(el('article',{class:'item','data-tags':w.tags.join(' ')},[el('span',{class:'badge',text:w.type}),el('h3',{},[el('a',{href:w.url,text:w.title})]),el('p',{class:'meta',text:w.desc})])));
 d.skills.forEach(g=>$('sk').append(el('div',{},[el('h3',{text:g.group}),el('ul',{},g.items.map(i=>el('li',{text:i})))])));
 d.about.forEach(p=>$('ab').append(el('p',{text:p})));
 d.education.forEach(e=>$('ed').append(el('li',{text:e})));
 $('ct').append(el('a',{href:'mailto:'+d.site.email,text:d.site.email}),' · '+d.site.location);
 d.site.links.forEach(l=>$('ct').append(' · ',el('a',{href:l.url,text:l.label})));
 applyLens();
}).catch(()=>{$('headline').textContent='Could not load content.json. Serve this folder over http (see README).'});
</script>
</body>
</html>
